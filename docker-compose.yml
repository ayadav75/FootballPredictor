services:
  db:
    image: postgres:16
    container_name: footballpredictor-db
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
