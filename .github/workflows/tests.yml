name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # The suite is self-contained: model/API tests run against in-memory
      # or temp-file SQLite and all external HTTP is mocked — no Postgres
      # service container needed.
      - name: Run tests
        run: pytest -q
